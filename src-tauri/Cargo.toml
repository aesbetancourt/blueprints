[package]
name = "Blueprints"
version = "0.2.0"
description = "Local-first desktop app for software specs, notes, and diagrams"
authors = []
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-zustand = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
notify = "7"
git2 = "0.19"
sysinfo = "0.33"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }
comemo = "0.5.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "blueprints_lib"
crate-type = ["lib", "cdylib", "staticlib"]
