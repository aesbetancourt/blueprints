[package]
name = "Blueprints"
version = "0.1.0"
description = "Blueprint Software Spec System"
authors = []
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-zustand = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
notify = "7"
git2 = "0.19"
sysinfo = "0.33"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "blueprints_lib"
crate-type = ["lib", "cdylib", "staticlib"]
